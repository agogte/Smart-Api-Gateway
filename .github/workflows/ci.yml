name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Smoke test (start servers and load balancer)
        run: |
          node server.js 4100 4 > servers.log 2>&1 &
          node Api.js 4100 4 > api.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:5001/lb/metrics > /dev/null && break; sleep 0.5; done
          curl -sf http://localhost:5001/ | grep -q "Server"
          curl -sf http://localhost:5001/dashboard/ | grep -q "Load Balancer Dashboard"
          curl -sf http://localhost:5001/lb/metrics | node -e '
            const m = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (m.servers.length !== 4 || m.totals.requests < 1) throw new Error("unexpected metrics: " + JSON.stringify(m.totals));
            console.log("metrics ok:", m.totals);
          '

      - name: Show logs on failure
        if: failure()
        run: cat servers.log api.log || true
